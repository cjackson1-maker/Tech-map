  const terr=t.territory?`<div class="p-terr">&#128506; ${t.territory}</div>`:'';
  const note=t.notes?`<div class="p-note">&#128221; ${t.notes}</div>`:'';
  return `<div class="p-name">${t.name}</div><div class="p-company">${t.company||''}</div><span class="p-rating ${RATING_CLASS[t.rating]}">${RATING_LABEL[t.rating]}</span>${ph}${em}<div class="p-loc">&#128205; ${loc}${t.zip?' &middot; ZIP '+t.zip:''}</div>${terr}${note}`;
}

function buildMarkers() {
  const jit={};
  for (const t of TECHS) {
    let lat=t.lat, lng=t.lng;
    if (!lat && t.state && STATE_CENTERS[t.state]) {
      lat=STATE_CENTERS[t.state][0]+(Math.random()-0.5)*1.2;
      lng=STATE_CENTERS[t.state][1]+(Math.random()-0.5)*1.2;
    }
    if (!lat) continue;
    const k=Math.round(lat*8)+','+Math.round(lng*8);
    jit[k]=(jit[k]||0)+1;
    if (jit[k]>1) { lat+=(Math.random()-0.5)*0.14; lng+=(Math.random()-0.5)*0.14; }
    const m=L.marker([lat,lng],{icon:makeIcon(t.rating)}).bindPopup(makePopup(t),{maxWidth:300});
    m._tech=t;
    allMarkers.push(m);
  }
  applyFilters();
}

function applyFilters() {
  markerLayer.clearLayers();
  const q=searchQuery.toLowerCase();
  const terr=document.getElementById('territory').value;
  let shown=0;
  const cnt={1:0,2:0,3:0,4:0};
  for (const m of allMarkers) {
    const t=m._tech;
    const fok=currentFilter==='all'||t.rating===currentFilter;
    const qok=!q||(t.name+' '+(t.company||'')+' '+(t.city||'')+' '+(t.state||'')).toLowerCase().includes(q);
    const tok=!terr||t.territory===terr;
    if (fok&&qok&&tok) { markerLayer.addLayer(m); shown++; cnt[t.rating]=(cnt[t.rating]||0)+1; }
  }
  document.getElementById('status').textContent=`Showing ${shown} of ${allMarkers.length} techs`;
  document.getElementById('b-total').textContent=shown+' Total';
  document.getElementById('b-1').textContent=(cnt[1]||0)+' Top Tech';
  document.getElementById('b-2').textContent=(cnt[2]||0)+' Good';
  document.getElementById('b-3').textContent=(cnt[3]||0)+' Support';
  document.getElementById('b-4').textContent=(cnt[4]||0)+' Struggling';
}

function setFilter(f) {
  currentFilter=f;
  ['all','1','2','3'].forEach(k=>{
    document.getElementById(`btn-${k}`).classList.toggle('on',String(f)===k);
  });
  applyFilters();
}

document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value;applyFilters();});
buildMarkers();
</script>
</body>
</html>
