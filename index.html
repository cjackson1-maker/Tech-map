.fbtn{padding:4px 11px;border-radius:6px;border:1px solid;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent}
.fbtn-all{color:#63b3ed;border-color:#2b4c7e}.fbtn-all.on{background:#2b4c7e;color:#fff}
.fbtn-1{color:#90cdf4;border-color:#2c5282}.fbtn-1.on{background:#2c5282;color:#fff}

#find-btn:hover{background:#2c5282}
#find-btn:disabled{background:#2d3748;color:#718096;cursor:not-allowed}
#clear-btn{background:transparent;color:#718096;border:1px solid #2d3748;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;display:none}

#map{flex:1}

function makeIcon(rating, highlight=false) {
  const c = RATING_COLOR[rating]||RATING_COLOR[3];
  const r = highlight ? 18 : 14;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2+4}" height="${r*2+10}" viewBox="0 0 ${r*2+4} ${r*2+10}">
    <ellipse cx="${r+2}" cy="${r*2+8}" rx="${r*0.6}" ry="3" fill="rgba(0,0,0,0.4)"/>
    <path d="M${r+2} 1C${(r+2)-r*0.85} 1 2 ${1+r*0.82} 2 ${r+2}c0 ${r*1.1} ${r} ${r*1.8} ${r} ${r*1.8}s${r}-${r*0.7} ${r}-${r*1.8}C${r*2+2} ${1+r*0.82} ${r+2+r*0.85} 1 ${r+2} 1z"
      fill="${c.bg}" stroke="${c.bd}" stroke-width="${highlight?2.5:1.8}"/>
    <text x="${r+2}" y="${r+4}" text-anchor="middle" font-size="${highlight?13:10}" font-weight="800" fill="${c.tx}" font-family="Segoe UI,Arial">${rating}</text>
  </svg>`;
  const sz = r*2+4;
  return L.divIcon({html:svg, iconSize:[sz,sz+10], iconAnchor:[sz/2,sz+10], popupAnchor:[0,-(sz+12)], className:''});
}

function makePopup(t, driveInfo=null) {

  const ph = t.phone?`<div class="p-row"><span class="ic">&#128222;</span><a href="tel:${t.phone.replace(/\D/g,'')}">${t.phone}</a></div>`:'';
  const em = t.email?`<div class="p-row"><span class="ic">&#9993;</span><a href="mailto:${t.email}">${t.email}</a></div>`:'';
  const terr = t.territory?`<div class="p-terr">&#128506; ${t.territory}</div>`:'';
  const note = t.notes?`<div class="p-note">&#128221; ${t.notes}</div>`:'';
  const drive = driveInfo ? `<div class="p-drive" style="flex-direction:column;gap:4px">
    <div>&#128664; ~${driveInfo.time} drive &nbsp;<span class="dr-dist">${driveInfo.miles} mi</span></div>
    <div style="display:flex;gap:12px;font-size:11px;margin-top:2px">
      <span>&#8594; One way: <strong style="color:#90cdf4">${estCost(driveInfo.miles)}</strong></span>
      <span>&#8644; Round trip: <strong style="color:${rtCostColor(driveInfo.miles)}">${estCost(driveInfo.miles * 2)}</strong>${(driveInfo.miles*0.76*2)>200?' <span style="color:#fc8181;font-size:10px">⚠ over $200</span>':''}</span>
      <span style="color:#4a5568">@ $0.76/mi</span>
    </div>
  </div>` : '';
  return `${drive}<div class="p-name">${t.name}</div><div class="p-company">${t.company||''}</div>
    <span class="p-rating ${RATING_CLASS[t.rating]}">${RATING_LABEL[t.rating]}</span>
    ${ph}${em}<div class="p-loc">&#128205; ${loc}${t.zip?' &middot; ZIP '+t.zip:''}</div>${terr}${note}`;
}

function buildMarkers() {
  const jit={};
  for (const t of TECHS) {
    let lat=t.lat, lng=t.lng;
    if (!lat && t.state && STATE_CENTERS[t.state]) {
      lat=STATE_CENTERS[t.state][0]+(Math.random()-0.5)*1.0;
      lng=STATE_CENTERS[t.state][1]+(Math.random()-0.5)*1.0;
    }
    if (!lat) continue;
    const k=Math.round(lat*8)+','+Math.round(lng*8);
    jit[k]=(jit[k]||0)+1;
    if (jit[k]>1){lat+=(Math.random()-0.5)*0.13;lng+=(Math.random()-0.5)*0.13;}
    t._lat=lat; t._lng=lng;
    const m=L.marker([lat,lng],{icon:makeIcon(t.rating)}).bindPopup(makePopup(t),{maxWidth:300});
    m._tech=t;
    allMarkers.push(m);
  }
  applyFilters();
}

function applyFilters() {

    const fok=currentFilter==='all'||t.rating===currentFilter;
    const qok=!q||(t.name+' '+(t.company||'')+' '+(t.city||'')+' '+(t.state||'')).toLowerCase().includes(q);
    const tok=!terr||t.territory===terr;
    if (fok&&qok&&tok){markerLayer.addLayer(m);shown++;cnt[t.rating]=(cnt[t.rating]||0)+1;}
  }
  document.getElementById('status').textContent=`${shown} of ${allMarkers.length} techs shown`;
  document.getElementById('b-total').textContent=shown+' Total';
  document.getElementById('b-1').textContent=(cnt[1]||0)+' Top Tech';

}

// Haversine distance in miles
function distMiles(lat1,lng1,lat2,lng2) {
  const R=3958.8, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Estimate drive time from miles (avg 55mph with 15% road factor)
function estDrive(miles) {
  const hrs = miles / 55 * 1.15;
  if (hrs < 1) return `${Math.round(hrs*60)} min`;
  const h = Math.floor(hrs), m = Math.round((hrs-h)*60);
  return m>0 ? `${h}h ${m}m` : `${h}h`;
}
function estCost(miles) {
  const cost = miles * 0.76;
  return cost < 1000 ? `$${cost.toFixed(0)}` : `$${(cost/1000).toFixed(1)}k`;
}
function costColor(miles, isRoundTrip) {
  const cost = miles * 0.76 * (isRoundTrip ? 2 : 1);
  if (isRoundTrip && cost > 200) return '#fc8181'; // red
  return '#68d391'; // green
}
function rtCostColor(miles) {
  return (miles * 0.76 * 2) > 200 ? '#fc8181' : '#68d391';
}

async function geocodeLocation(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&countrycodes=us&format=json&limit=1`;
  try {
    const r = await fetch(url, {headers:{'Accept-Language':'en'}});
    const d = await r.json();
    if (d&&d[0]) return {lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon), display:d[0].display_name.split(',').slice(0,3).join(',')};
  } catch(e) {}
  return null;
}

async function findNearest() {
  const query = document.getElementById('loc-input').value.trim();
  if (!query) { document.getElementById('prox-status').textContent='Enter a location first'; return; }
  
  const btn = document.getElementById('find-btn');
  btn.disabled=true; btn.textContent='Searching...';
  document.getElementById('prox-status').textContent='Geocoding location...';

  const geo = await geocodeLocation(query);
  if (!geo) {
    document.getElementById('prox-status').textContent='Location not found. Try a city name or ZIP.';
    btn.disabled=false; btn.innerHTML='📍 Find Nearest';
    return;
  }

  clearProximity(false);
  const topN = parseInt(document.getElementById('prox-count').value);

  // Place search location marker
  const searchIcon = L.divIcon({
    html:`<div style="background:#e53e3e;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px rgba(229,62,62,.4),0 2px 8px rgba(0,0,0,.5)"></div>`,
    iconSize:[16,16],iconAnchor:[8,8],className:''
  });
  searchMarker = L.marker([geo.lat,geo.lng],{icon:searchIcon,zIndexOffset:1000})
    .bindPopup(`<div style="color:#f7fafc;font-size:13px;font-weight:600">&#128205; Search Location</div><div style="font-size:11px;color:#a0aec0;margin-top:3px">${geo.display}</div>`)
    .addTo(proxLayer);

  // Score all techs by distance
  const scored = allMarkers
    .filter(m=>m._tech._lat&&m._tech._lng)
    .map(m=>{
      const t=m._tech;
      const miles=distMiles(geo.lat,geo.lng,t._lat,t._lng);
      return {m,t,miles,time:estDrive(miles),cost:estCost(miles)};
    })
    .sort((a,b)=>a.miles-b.miles)
    .slice(0,topN);

  // Highlight top N markers and draw lines
  scored.forEach((s,i)=>{
    // Line from search point to tech
    L.polyline([[geo.lat,geo.lng],[s.t._lat,s.t._lng]],{
      color:'#4299e1',weight:1.5,opacity:.5,dashArray:'6,4'
    }).addTo(proxLayer);
    // Replace marker with highlighted version
    markerLayer.removeLayer(s.m);
    const hl = L.marker([s.t._lat,s.t._lng],{icon:makeIcon(s.t.rating,true),zIndexOffset:500})
      .bindPopup(makePopup(s.t,{time:s.time,miles:Math.round(s.miles)}),{maxWidth:320});
    hl._tech=s.t; hl._score=s;
    proxLayer.addLayer(hl);
    s.hlMarker=hl;
  });

  // Show result panel
  const shortLoc = geo.display.split(',')[0].trim();
  document.getElementById('rp-loc').textContent=shortLoc;
  const list=document.getElementById('result-list');
  list.innerHTML='';
  scored.forEach((s,i)=>{
    const c=RATING_COLOR[s.t.rating]||RATING_COLOR[3];
    const div=document.createElement('div');
    div.className='res-card';
    div.innerHTML=`
      <div class="res-name">
        <span class="res-rank" style="background:${c.bg};color:${c.tx}">${i+1}</span>
        ${s.t.name}
        <span class="res-rating ${RATING_CLASS[s.t.rating]}" style="margin-left:auto">${s.t.rating}</span>
      </div>
      <div class="res-company">${s.t.company||''}</div>
      <div style="margin-top:4px">
        <span class="res-drive">&#128664; ~${s.time}</span>
        <span class="res-dist">&nbsp;${Math.round(s.miles)} mi</span>
      </div>
      <div style="display:flex;gap:10px;font-size:11px;margin-top:4px;flex-wrap:wrap">
        <span style="color:#a0aec0">&#8594; One way: <strong style="color:#68d391">${estCost(s.miles)}</strong></span>
        <span style="color:#a0aec0">&#8644; Round trip: <strong style="color:${rtCostColor(s.miles)}">${estCost(s.miles * 2)}</strong>${(s.miles*0.76*2)>200?' <span style="color:#fc8181;font-size:10px">⚠</span>':''}</span>
      </div>
      <div style="font-size:11px;color:#718096;margin-top:2px">&#128205; ${[s.t.city,s.t.state].filter(Boolean).join(', ')||s.t.state||'—'}</div>
      <div class="res-contact">
        ${s.t.phone?`<a href="tel:${s.t.phone.replace(/\D/g,'')}" onclick="event.stopPropagation()">&#128222; ${s.t.phone}</a>`:''}
        ${s.t.email?`<a href="mailto:${s.t.email}" onclick="event.stopPropagation()">&#9993; Email</a>`:''}
      </div>`;
    div.addEventListener('click',()=>{
      map.setView([s.t._lat,s.t._lng],8,{animate:true});
      setTimeout(()=>s.hlMarker.openPopup(),400);
      document.querySelectorAll('.res-card').forEach(c=>c.classList.remove('active'));
      div.classList.add('active');
    });
    list.appendChild(div);
  });

  document.getElementById('result-panel').style.display='flex';
  document.getElementById('clear-btn').style.display='inline-block';
  document.getElementById('prox-status').textContent=`${scored.length} nearest found`;
  btn.disabled=false; btn.innerHTML='📍 Find Nearest';

  // Fit map to show search point + results
  const bounds=L.latLngBounds([[geo.lat,geo.lng],...scored.map(s=>[s.t._lat,s.t._lng])]);
  map.fitBounds(bounds,{padding:[40,40]});
}

function clearProximity(resetInput=true) {
  proxLayer.clearLayers();
  if (searchMarker) { searchMarker=null; }

  document.getElementById('result-panel').style.display='none';
  document.getElementById('clear-btn').style.display='none';
  document.getElementById('prox-status').textContent='';
  if (resetInput) document.getElementById('loc-input').value='';
  map.setView([38.5,-96],4);
}
